<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7 Vagas - Portal de Oportunidades</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="header">

            <div class="header-content">

                <h1 class="logo">
                    7 Vagas
                </h1>

                <p class="tagline">
                    Seu portal de oportunidades em Sete Lagoas
                </p>

                <a
                    href="https://setelagoaspolitica.web.app/"
                    class="back-link"
                >
                    ← Voltar para o site
                </a>

            </div>

        </header>


        <!-- =====================================================
             FILTROS
             ===================================================== -->

        <section class="filters-section">

            <div class="filters-container">

                <h2>
                    Filtrar Vagas
                </h2>

                <div class="filters-grid">

                    <!-- Busca -->

                    <div class="filter-group">

                        <label for="search-input">
                            Buscar por cargo ou empresa:
                        </label>

                        <input
                            type="text"
                            id="search-input"
                            class="filter-input"
                            placeholder="Digite o cargo ou empresa..."
                        >

                    </div>


                    <!-- Salário -->

                    <div class="filter-group">

                        <label for="salary-filter">
                            Filtrar por salário:
                        </label>

                        <select
                            id="salary-filter"
                            class="filter-input"
                        >

                            <option value="">
                                Todos os salários
                            </option>

                            <option value="especificado">
                                Salário especificado
                            </option>

                            <option value="nao-especificado">
                                Salário não especificado
                            </option>

                            <option value="comissionado">
                                Comissionado
                            </option>

                        </select>

                    </div>


                    <!-- Empresa -->

                    <div class="filter-group">

                        <label for="company-filter">
                            Filtrar por empresa:
                        </label>

                        <select
                            id="company-filter"
                            class="filter-input"
                        >

                            <option value="">
                                Todas as empresas
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Limpar filtros -->

                <button
                    id="reset-filters"
                    class="btn-reset"
                    type="button"
                >
                    Limpar Filtros
                </button>

            </div>

        </section>


        <!-- =====================================================
             CONTADOR
             ===================================================== -->

        <section class="counter-section">

            <p class="total-vagas">

                Total de vagas:

                <strong id="vagas-count">
                    0
                </strong>

            </p>

        </section>


        <!-- =====================================================
             LISTA DE VAGAS
             ===================================================== -->

        <section class="vagas-section">

            <div
                id="vagas-container"
                class="vagas-grid"
            >

                <!--
                    As vagas serão inseridas
                    automaticamente pelo JavaScript.
                -->

            </div>


            <!-- Nenhum resultado -->

            <div
                id="no-results"
                class="no-results"
                style="display: none;"
            >

                <p>
                    Nenhuma vaga encontrada com os filtros selecionados.
                </p>

            </div>

        </section>


        <!-- =====================================================
             MODAL — DETALHES DA VAGA
             ===================================================== -->

        <div
            id="modal"
            class="modal"
            style="display: none;"
        >

            <div class="modal-content">

                <button
                    type="button"
                    class="close-modal"
                    aria-label="Fechar detalhes"
                >
                    &times;
                </button>

                <div id="modal-body">

                    <!--
                        Os detalhes da vaga
                        serão inseridos pelo JavaScript.
                    -->

                </div>

            </div>

        </div>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <footer class="footer">

            <p>
                &copy; 2026 7 Vagas.
                Vagas de grupos de empregos locais no WhatsApp
            </p>

        </footer>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js"></script>

</body>

</html>
