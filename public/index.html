<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Vagas - Portal de Oportunidades</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">

<!-- Header -->
<header class="header">
    <div class="header-content">

        <h1 class="logo">7 Vagas</h1>

        <p class="tagline">
            Seu portal de oportunidades em Sete Lagoas
        </p>

        <!-- Botão Voltar -->
        <a 
            href="https://setelagoaspolitica.web.app/"
            style="
                display: inline-block;
                margin-top: 20px;
                padding: 10px 18px;
                background: #E4032E;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-weight: 600;
                font-size: 14px;
            "
        >
            ← Voltar para o site
        </a>

    </div>
</header>




        <!-- Filtros -->
        <section class="filters-section">
            <div class="filters-container">

                <h2>Filtrar Vagas</h2>

                <div class="filters-grid">

                    <div class="filter-group">
                        <label for="search-input">
                            Buscar por cargo ou empresa:
                        </label>

                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Digite o cargo ou empresa..."
                            class="filter-input"
                        >
                    </div>


                    <div class="filter-group">
                        <label for="salary-filter">
                            Filtrar por salário:
                        </label>

                        <select 
                            id="salary-filter" 
                            class="filter-input"
                        >
                            <option value="">
                                Todos os salários
                            </option>

                            <option value="especificado">
                                Salário especificado
                            </option>

                            <option value="nao-especificado">
                                Salário não especificado
                            </option>

                            <option value="comissionado">
                                Comissionado
                            </option>
                        </select>
                    </div>


                    <div class="filter-group">
                        <label for="company-filter">
                            Filtrar por empresa:
                        </label>

                        <select 
                            id="company-filter" 
                            class="filter-input"
                        >
                            <option value="">
                                Todas as empresas
                            </option>
                        </select>
                    </div>

                </div>

                <button 
                    id="reset-filters" 
                    class="btn-reset"
                >
                    Limpar Filtros
                </button>

            </div>
        </section>


        <!-- Contador de vagas -->
        <section class="counter-section">

            <p class="total-vagas">
                Total de vagas:
                <strong id="vagas-count">0</strong>
            </p>

        </section>


        <!-- Lista de Vagas -->
        <section class="vagas-section">

            <div 
                id="vagas-container" 
                class="vagas-grid"
            >
                <!-- As vagas serão inseridas aqui via JavaScript -->
            </div>


            <div 
                id="no-results" 
                class="no-results" 
                style="display: none;"
            >
                <p>
                    Nenhuma vaga encontrada com os filtros selecionados.
                </p>
            </div>

        </section>


        <!-- Modal para detalhes da vaga -->
        <div 
            id="modal" 
            class="modal" 
            style="display: none;"
        >

            <div class="modal-content">

                <span class="close-modal">
                    &times;
                </span>

                <div id="modal-body">
                    <!-- Conteúdo da vaga será inserido aqui -->
                </div>

            </div>

        </div>


        <!-- Footer -->
        <footer class="footer">

            <p>
                &copy; 2026 7 Vagas.
                Vagas de grupos de empregos locais no WhatsApp
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
```
